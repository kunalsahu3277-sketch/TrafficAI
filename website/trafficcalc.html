<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traffic AI – Intelligent Intersection Analytics & YOLOv8 Engine</title>
  <meta name="description" content="Next-generation intelligent traffic intersection safety analyzer and real-time YOLOv8 computer vision detection engine.">
  
  <!-- Modern Fonts & External Dependencies -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <!-- Top App Navigation Bar -->
  <header>
    <div class="brand-wrapper" onclick="navigateTo('dash')">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">TRAFFIC<span>AI</span></div>
      </div>
      <div class="brand-badge">YOLOv8 Vision</div>
    </div>

    <div class="header-actions">
      <!-- Live Server Status Indicator -->
      <div class="server-status-pill" id="serverStatusPill" onclick="checkBackendHealth()" title="Click to test connection">
        <div class="status-dot checking" id="serverStatusDot"></div>
        <span id="serverStatusText">Connecting to YOLO Backend...</span>
      </div>

      <button class="btn btn-primary btn-sm" onclick="navigateTo('ai'); setTimeout(loadSampleImage, 100)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
        Test Sample Image
      </button>
    </div>
  </header>

  <!-- App Body Layout -->
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="nav-section-title">Telemetry & Vision</div>
      
      <a class="nav-item active" data-tab="dash" onclick="navigateTo('dash')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        Dashboard
      </a>

      <a class="nav-item" data-tab="ai" onclick="navigateTo('ai')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        YOLO Vision Studio
        <span class="nav-badge">AI Live</span>
      </a>

      <div class="nav-section-title">Safety & Geometry</div>

      <a class="nav-item" data-tab="geometry" onclick="navigateTo('geometry')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/></svg>
        Intersection Geometry
      </a>

      <a class="nav-item" data-tab="spatial" onclick="navigateTo('spatial')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
        Conflict Heatmap
      </a>

      <a class="nav-item" data-tab="safety" onclick="navigateTo('safety')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Safety Indices (PSI)
      </a>

      <div class="nav-section-title">Audit & Interventions</div>

      <a class="nav-item" data-tab="problems" onclick="navigateTo('problems')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Site Deficiencies
      </a>

      <a class="nav-item" data-tab="countermeasures" onclick="navigateTo('countermeasures')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        Countermeasures
      </a>

      <a class="nav-item" data-tab="reports" onclick="navigateTo('reports')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Reports & Export
      </a>
    </aside>

    <!-- Dynamic Content Area -->
    <main class="content-area" id="mainContent">
      <!-- Injected by app.js -->
    </main>
  </div>

  <!-- Main Application Logic -->
  <script src="app.js"></script>
</body>
</html>
